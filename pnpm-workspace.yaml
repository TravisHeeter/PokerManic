packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 12 runs dependency install scripts only after explicit approval.
# esbuild downloads/verifies its platform binary; vue-demi configures Vue compatibility.
# @scarf/scarf performs optional install-time analytics and is intentionally denied.
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  vue-demi: true
